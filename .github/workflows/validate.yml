name: Validate DYOR observatory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m compileall -q assets.py trades.py pools.py observatory.py scripts
      - run: python3 -m unittest tests.test_trade_history tests.test_service_registry tests.test_refresh_sources
      - run: node --test tests/*.test.cjs
      - run: python3 build.py && python3 verify.py
